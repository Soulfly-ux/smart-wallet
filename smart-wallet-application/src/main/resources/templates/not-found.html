<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="/css/common.css">
  <link rel="stylesheet" type="text/css" href="/css/not-found.css">
  <title>Page Not Found</title>
</head>
<body>
<main>
  <section class="section full-height">
    <div class="container">
      <a href="/" class="logo-big">
        <img src="/images/smart-wallet-text-only.png" alt="Logo Image">
      </a>
    </div>

    <div class="not-found-card">
      <p class="status-code">404</p>
      <h1>Page not found</h1>
      <p class="not-found-text">
        The page you are trying to reach does not exist or is no longer available.
        You can return to the home page or log in again from below.
      </p>

      <div class="not-found-actions">
        <a class="button back-home" href="/">Go Home</a>
        <a class="button back-login" th:href="@{/login}">Login</a>
      </div>
    </div>
  </section>
</main>
<th:block th:insert="fragments/footer :: footer"></th:block>
</body>
</html>
